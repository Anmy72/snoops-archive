services:
  piwigo-main:
    image: piwigo/piwigo:latest
    restart: on-failure

    environment:
      TZ: ${TZ:-UTC}
      PIWIGO_UID: ${PIWIGO_UID:-1000}
      PIWIGO_GID: ${PIWIGO_GID:-1000}

    ports:
      - "${PIWIGO_PORT:-8080}:80"

    depends_on:
      piwigo-db:
        condition: service_healthy

    volumes:
      - piwigo_data:/var/www/html/piwigo

    networks:
      - piwigo-network

  piwigo-db:
    image: mariadb:lts
    restart: on-failure

    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "true"
      MARIADB_USER: piwigodb_user
      MARIADB_DATABASE: piwigodb
      MARIADB_PASSWORD: ${DB_USER_PASSWORD:?DB_USER_PASSWORD must be set}
      TZ: ${TZ:-UTC}

    volumes:
      - piwigo_db:/var/lib/mysql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - piwigo-network

networks:
  piwigo-network:
    driver: bridge

volumes:
  piwigo_data:
  piwigo_db:
